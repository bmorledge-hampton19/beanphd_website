<!DOCTYPE html>
<html>
    <head>
        <title>Dr. Bean Games</title>
        <base target="_self" href="../../../">
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1"/>
        <meta property="og:title" content="Dr. Bean Games" />
        <meta property="og:site_name" content="Dr. Bean Games" />
        <meta property="og:type" content="website" />
        <meta property="og:url" content="https://beanphd.com/" />
        <meta property="og:image" content="https://beanphd.com/images/dr_bean/large.png" />
        <meta property="og:description" content="Dr. Bean's website. Stop by and chat with the bean himself!">
        <link rel="icon" type="image/png" href="images/dr_bean/large.png"/>
        <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Winky+Rough|PT+Sans+Caption">
        <link rel="stylesheet" href="base.css"/>
    </head>

    <body style="background-color: #ffaa69;">
        <div class="dr-bean-logo">
            <img src="images/dr_bean/default.png" id = "dr-bean" alt="Hi! I'm Dr. Bean!" />
        </div>

        <div class="chat-container" id="chat-container">
            <div class="dr-bean-speech-bubble" id="speech-bubble">
                <div class="dr-bean-speech-bubble-text" id="msg"></div>
            </div>
            <hr class="chat-divider">
            <div class="response-container" id="response-container">
                <button class="skip-button" id="skip-button">
                    <div class="user-response">Skip</div>
                </button>
                <script src="js/main.js"></script>
                <script>
                    init_speech_bubble(
                        [
                            "I see! ",
                            "Not enough people appreciate the little things in life, you know? ",
                            "After all, you've got to enjoy what you're doing just as much as where you're going... ", "",
                            "With that in mind, I think \"Nightlives\" is the game you're looking for. ",
                            "Go ahead and give it a try!"
                        ],
                        "nightlives.png", "https://mr-dr-bean.itch.io/nightlives"
                    )
                    init_responses(
                        [
                            "Will do!",
                            "Actually, I'm looking for a different kind of adventure.",
                        ],
                        [
                            "https://mr-dr-bean.itch.io/nightlives",
                            "chat_root/game_categories/adventure/adventure_games_root.html",
                        ]
                    )
                    start_speech_bubble()
                </script>
            </div>
        </div>

        <div class="footer">
            <div class="logo-links-container">
                <a href="https://mr-dr-bean.itch.io/" target="_blank">
                    <img src="images/link_logos/itchio-logo.svg" height="50px" />
                </a>
                <a href="mailto:drbean@beanphd.com">
                    <img src="images/link_logos/email-logo.svg" height="50px" />
                </a>
            </div>
            <div class="dr-bean-copyright">Dr. Bean Games LLC © 2026</div>
        </div>
    </body>
</html>
